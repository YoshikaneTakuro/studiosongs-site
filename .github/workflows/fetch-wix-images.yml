name: 旧サイト（Wix）の画像を取り込む
on:
  workflow_dispatch:
  push:
    paths: ['scripts/wix-images.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          grep -v '^#' scripts/wix-images.txt | while IFS='|' read -r dest id tf; do
            [ -z "$dest" ] && continue
            mkdir -p "public/$(dirname "$dest")"
            base="https://static.wixstatic.com/media/c3b58c_${id}"
            case "$tf" in
              raw) src="$base" ;;
              *)   ext="${dest##*.}"; if [ "$ext" = "png" ]; then src="$base/v1/${tf}/img.png"; else src="$base/v1/${tf},enc_jpg/img.jpg"; fi ;;
            esac
            curl -fsSL "$src" -o "public/$dest" || echo "FAILED $dest"
          done
          ls -la public/images
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet || git commit -m "旧サイト（Wix）の画像を取り込み"
          git push
